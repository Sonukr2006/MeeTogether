<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#be185d;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main Logo Group (centered and scaled up) -->
  <g transform="translate(256, 256) scale(1.4) translate(-140, -140)">
    <!-- Left Triangle (Purple) - Rising up -->
    <polygon points="50,150 0,250 100,250" fill="url(#grad-purple)"/>
    
    <!-- Middle Triangle (Pink) - Higher -->
    <polygon points="140,120 90,230 190,230" fill="url(#grad-pink)"/>
    
    <!-- Right Triangle (Orange) - Balanced -->
    <polygon points="230,150 180,250 280,250" fill="url(#grad-orange)"/>
    
    <!-- Connection Circles -->
    <circle cx="50" cy="270" r="8" fill="url(#grad-purple)"/>
    <circle cx="140" cy="270" r="8" fill="url(#grad-pink)"/>
    <circle cx="230" cy="270" r="8" fill="url(#grad-orange)"/>
    
    <!-- Connection Lines -->
    <line x1="50" y1="260" x2="140" y2="260" stroke="#ec4899" stroke-width="2" opacity="0.4"/>
    <line x1="140" y1="260" x2="230" y2="260" stroke="#f97316" stroke-width="2" opacity="0.4"/>
  </g>

</svg>
